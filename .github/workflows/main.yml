name: Deploy Affiliate Marketing App to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  APP_DIR: /var/www/aiatoz-affiliate-marketing

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check AWS Role ARN
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "AWS_ROLE_ARN secret is missing"
            exit 1
          fi
          echo "AWS_ROLE_ARN exists"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Check EC2 Instance ID
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "EC2_INSTANCE_ID secret is missing"
            exit 1
          fi
          echo "EC2_INSTANCE_ID exists"

      - name: Deploy application to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command             --region "${{ env.AWS_REGION }}"             --instance-ids "${{ secrets.EC2_INSTANCE_ID }}"             --document-name "AWS-RunShellScript"             --comment "Deploy aiatoz-affiliate-marketing"             --parameters 'commands=[
              "set -e",
              "echo Starting deployment...",
              "sudo mkdir -p ${{ env.APP_DIR }}",
              "sudo chown -R ubuntu:ubuntu ${{ env.APP_DIR }}",
              "cd ${{ env.APP_DIR }}",
              "if [ -d .git ]; then git fetch origin && git reset --hard origin/main; else git clone https://github.com/aiatozofficial/aiatoz-affiliate-marketing.git .; fi",
              "echo Repository updated",
              "docker compose down || true",
              "docker compose build --no-cache",
              "docker compose up -d",
              "docker image prune -f",
              "echo Deployment completed successfully"
            ]'             --query "Command.CommandId"             --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed             --region "${{ env.AWS_REGION }}"             --command-id "$COMMAND_ID"             --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          echo "EC2 deployment completed"

      - name: Show deployment output
        run: |
          COMMAND_ID=$(aws ssm list-commands             --region "${{ env.AWS_REGION }}"             --instance-id "${{ secrets.EC2_INSTANCE_ID }}"             --max-items 1             --query 'Commands[0].CommandId'             --output text)

          aws ssm get-command-invocation             --region "${{ env.AWS_REGION }}"             --command-id "$COMMAND_ID"             --instance-id "${{ secrets.EC2_INSTANCE_ID }}"             --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'             --output json

      - name: Deployment completed
        run: |
          echo "======================================"
          echo "Deployment successful"
          echo "Application: aiatoz-affiliate-marketing"
          echo "Region: us-east-1"
          echo "======================================"
